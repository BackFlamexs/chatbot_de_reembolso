<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente de Reembolso</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f4f6f8; color: #1e293b; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 740px; margin: auto; }
    h1 { margin: 0; font-size: 1.6rem; }
    .description { color: #475569; margin: 8px 0 20px; }
    .panel { background: white; border: 1px solid #cbd5e1; border-radius: 12px; overflow: hidden; }
    .toolbar { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    button, textarea { font: inherit; }
    button { cursor: pointer; border-radius: 7px; padding: 9px 14px; border: 1px solid #cbd5e1; background: white; color: #1e293b; }
    button:disabled { cursor: wait; opacity: .6; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    #messages { height: min(48vh, 440px); min-height: 240px; overflow-y: auto; padding: 16px; }
    .message { padding: 12px 14px; background: #f1f5f9; border-radius: 9px; margin: 0 28px 14px 0; overflow-wrap: anywhere; }
    .message.user { background: #eaf2ff; margin-left: 28px; margin-right: 0; }
    .message p { margin: 5px 0 0; white-space: pre-wrap; }
    .result { border-top: 1px solid #cbd5e1; padding-top: 8px; margin-top: 10px; }
    .result strong { display: block; }
    form { padding: 16px; border-top: 1px solid #e2e8f0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    textarea { width: 100%; min-height: 96px; padding: 10px; border: 1px solid #94a3b8; border-radius: 7px; resize: vertical; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
    #send { background: #1d4ed8; border-color: #1d4ed8; color: white; }
    small { color: #475569; }
    #loading { color: #1d4ed8; margin: 12px 0 0; }
    #error { color: #991b1b; background: #fef2f2; padding: 10px; border-radius: 6px; margin: 12px 0 0; }
    footer { margin-top: 12px; font-size: .85rem; color: #475569; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Assistente de Reembolso</h1>
    <p class="description">Converse para simular seu reembolso de alimentação na TechNova.</p>
    <section class="panel" aria-label="Chat de reembolso">
      <div class="toolbar"><strong>Sua conversa</strong><button id="new" type="button">Nova conversa</button></div>
      <div id="messages" role="log" aria-label="Histórico de mensagens" aria-live="polite"></div>
      <form id="form">
        <label for="message">Sua mensagem</label>
        <textarea id="message" maxlength="1000" required placeholder="Descreva sua despesa ou pergunte quais dados informar."></textarea>
        <div class="actions"><small id="count">0 / 1000 caracteres</small><button id="send" type="submit">Enviar</button></div>
        <p id="loading" role="status" hidden>Aguardando o assistente… Isso pode levar alguns segundos.</p>
        <p id="error" role="alert" hidden></p>
      </form>
    </section>
    <footer><a href="/docs">Documentação da API</a></footer>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#form');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const newChat = document.querySelector('#new');
    const loading = document.querySelector('#loading');
    const error = document.querySelector('#error');
    const count = document.querySelector('#count');
    const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    let sessionId = null;
    let busy = false;

    function addMessage(author, text, data) {
      const box = document.createElement('div');
      box.className = 'message' + (author === 'Você' ? ' user' : '');
      const name = document.createElement('strong');
      name.textContent = author;
      const content = document.createElement('p');
      content.textContent = text;
      box.append(name, content);
      if (data) {
        const result = document.createElement('div');
        result.className = 'result';
        const labels = { faltam_dados: 'Faltam informações', reembolsavel: 'Reembolsável', nao_reembolsavel: 'Não reembolsável' };
        const status = document.createElement('strong');
        status.textContent = labels[data.status] || 'Resultado';
        result.append(status);
        if (typeof data.valor_reembolsavel === 'number') {
          const value = document.createElement('p');
          value.textContent = 'Valor: ' + money.format(data.valor_reembolsavel);
          result.append(value);
        }
        if (Array.isArray(data.dados_faltantes) && data.dados_faltantes.length) {
          const list = document.createElement('ul');
          data.dados_faltantes.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            list.append(li);
          });
          result.append(list);
        }
        box.append(result);
      }
      messages.append(box);
      messages.scrollTop = messages.scrollHeight;
    }

    function welcome() {
      addMessage('Assistente', 'Olá! Informe a data, o valor e o tipo da refeição, se tem comprovante, o contexto de trabalho, se houve álcool e se já recebeu reembolso de alimentação no mesmo dia. Também pode perguntar por onde começar.');
    }

    function setBusy(value) {
      busy = value;
      send.disabled = newChat.disabled = input.disabled = value;
      loading.hidden = !value;
      send.textContent = value ? 'Aguarde…' : 'Enviar';
      form.setAttribute('aria-busy', String(value));
    }

    input.addEventListener('input', () => { count.textContent = `${input.value.length} / 1000 caracteres`; });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (busy) return;
      const message = input.value.trim();
      error.hidden = true;
      if (!message || message.length > 1000) {
        error.textContent = 'Escreva uma mensagem de 1 a 1000 caracteres.';
        error.hidden = false;
        return;
      }
      addMessage('Você', message);
      setBusy(true);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      try {
        const payload = { message };
        if (sessionId) payload.session_id = sessionId;
        const response = await fetch('/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload), signal: controller.signal
        });
        const data = await response.json();
        if (!response.ok) {
          const detail = typeof data.detail === 'string' ? data.detail : 'Confira sua mensagem e tente novamente.';
          throw new Error(`Erro ${response.status}: ${detail}`);
        }
        if (typeof data.session_id !== 'string' || typeof data.reply !== 'string') throw new Error('A API retornou uma resposta inesperada.');
        sessionId = data.session_id;
        addMessage('Assistente', data.reply, data);
        input.value = '';
        count.textContent = '0 / 1000 caracteres';
      } catch (err) {
        const text = err.name === 'AbortError' ? 'A resposta demorou demais. Tente novamente em instantes.'
          : err instanceof TypeError ? 'Não foi possível acessar a API. Verifique se o servidor está ligado.' : err.message;
        error.textContent = text + ' Sua mensagem foi mantida no campo para tentar novamente.';
        error.hidden = false;
        addMessage('Sistema', 'Não foi possível concluir esta solicitação.');
      } finally {
        clearTimeout(timer);
        setBusy(false);
        input.focus();
      }
    });

    newChat.addEventListener('click', () => {
      sessionId = null;
      messages.replaceChildren();
      input.value = '';
      count.textContent = '0 / 1000 caracteres';
      error.hidden = true;
      welcome();
      input.focus();
    });
    welcome();
  </script>
</body>
</html>
